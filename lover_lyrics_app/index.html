<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lover, You Should've Come Over — Floating Lyrics & Sonic Canvas</title>
    <meta name="description" content="Eksplorasi lirik melayang interaktif lagu 'Lover, You Should've Come Over' karya Jeff Buckley dengan fisika dinamis, synth akustik, dan suasana vinyl & hujan.">
    
    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23121018' stroke='%23e6a756' stroke-width='4'/><text x='50' y='64' font-size='42' font-family='serif' font-style='italic' fill='%23fcd595' text-anchor='middle'>JB</text></svg>">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Dynamic Atmosphere Background Elements -->
    <canvas id="rain-canvas"></canvas>
    <div class="film-grain-overlay"></div>
    <div class="ambient-light-vignette"></div>

    <!-- Top Navigation Bar -->
    <header class="top-navbar">
        <div class="brand-section">
            <div class="song-badge">
                <div class="vinyl-icon" title="Vinyl Record Playing"></div>
                <div class="song-title-group">
                    <span class="song-name">Lover, You Should've Come Over</span>
                    <span class="song-artist">Jeff Buckley • Grace (1994)</span>
                </div>
            </div>
        </div>

        <div class="nav-controls">
            <!-- Instant Search -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Cari bait lirik..." autocomplete="off">
            </div>

            <!-- Layout Modes -->
            <div class="btn-group" role="group" aria-label="Layout Modes">
                <button class="nav-btn active" data-mode="drift" title="Melayang bebas di seluruh layar">🌊 Drift</button>
                <button class="nav-btn" data-mode="spotlight" title="Fokus lirik sesuai detik lagu">🎭 Spotlight</button>
                <button class="nav-btn" data-mode="orbit" title="Orbit melingkar galaksi">🌌 Orbit</button>
                <button class="nav-btn" data-mode="cascade" title="Air terjun bertingkat">🪜 Cascade</button>
                <button class="nav-btn" data-mode="grid" title="Papan galeri rapi">📌 Grid</button>
            </div>

            <!-- Quick Action Buttons -->
            <button id="scatter-btn" class="nav-btn" title="Hamburkan / Lontar kartu ke posisi acak">🌪️ Acak</button>
            <button id="trans-toggle-btn" class="nav-btn active" title="Tampilkan/Sembunyikan Terjemahan Bahasa Indonesia">🇮🇩 Arti</button>
            <button id="new-card-btn" class="action-btn" title="Tambah tab lirik atau catatan baru">✨ + Tab Baru</button>
        </div>
    </header>

    <!-- Floating Tabs Playground Canvas -->
    <main id="floating-canvas" aria-label="Lyric Cards Canvas"></main>

    <!-- Bottom Audio Player Bar -->
    <footer class="bottom-player-bar">
        <!-- Track & Chords Info -->
        <div class="player-track-info">
            <label class="album-art-thumbnail" title="Klik untuk memutar file audio MP3 kustom dari perangkatmu">
                <input type="file" id="custom-audio-file" accept="audio/*" style="display: none;">
                <div style="font-family: var(--font-serif); font-size: 20px; color: var(--amber-light); font-style: italic; cursor: pointer;">JB</div>
            </label>
            <div class="track-texts">
                <span class="track-name">Track 07 — Grace</span>
                <div class="track-active-chord">
                    <span>Akor:</span>
                    <span id="active-chord-name" class="chord-badge">Dmaj7</span>
                </div>
            </div>
        </div>

        <!-- Center Playback Controls & Scrubber -->
        <div class="player-center-controls">
            <div class="transport-buttons">
                <button id="play-pause-btn" class="play-pause-main-btn" title="Putar / Jeda Musik">
                    <span style="font-size: 16px; margin-left: 2px;">▶</span>
                </button>
            </div>
            <div class="scrubber-container">
                <span id="time-current" class="time-label">0:00</span>
                <div id="scrubber-wrap" class="scrubber-bar-wrap">
                    <div id="scrubber-fill" class="scrubber-bar-fill">
                        <div class="scrubber-handle"></div>
                    </div>
                </div>
                <span id="time-total" class="time-label">6:35</span>
            </div>
        </div>

        <!-- Right Ambience & Visualizer Controls -->
        <div class="player-right-controls">
            <!-- Waveform Canvas -->
            <canvas id="waveform-canvas" class="waveform-canvas" title="Real-time Audio Visualizer"></canvas>

            <!-- Sound Ambience Toggles -->
            <div class="ambience-controls">
                <button id="rain-toggle" class="ambience-toggle active" title="Suara & Efek Hujan (Looking out the door...)">🌧️ Hujan</button>
                <button id="vinyl-toggle" class="ambience-toggle active" title="Desis Analog Piringan Hitam">📻 Vinyl</button>
            </div>

            <!-- Master Volume -->
            <div class="volume-slider-group" title="Volume Utama">
                <span style="font-size: 13px; color: var(--text-muted);">🔊</span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
            </div>
        </div>
    </footer>

    <!-- Modal: Buat Kartu Lirik Kustom -->
    <div id="modal-backdrop" class="modal-backdrop">
        <div class="custom-card-modal">
            <h3 class="modal-title">✨ Buat Tab Lirik / Catatan Baru</h3>
            <p class="modal-subtitle">Tulis bait lirik atau perasaanmu untuk diapungkan ke dalam kanvas.</p>

            <div class="form-group">
                <label class="form-label" for="input-quote">Bait Lirik / Kutipan:</label>
                <textarea id="input-quote" class="form-textarea" placeholder="Tuliskan lirik atau kalimat puitis di sini..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="input-translation">Arti / Catatan Tambahan (Opsional):</label>
                <input type="text" id="input-translation" class="form-input" placeholder="Terjemahan atau makna di balik lirik...">
            </div>

            <div class="form-group">
                <label class="form-label" for="input-tag">Kategori / Mood Tag:</label>
                <input type="text" id="input-tag" class="form-input" placeholder="Contoh: Malam Rindu, Akustik, Kenangan">
            </div>

            <div class="modal-actions">
                <button id="modal-close-btn" class="btn-secondary">Batal</button>
                <button id="modal-submit-btn" class="btn-primary">Apungkan Tab</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-notice" class="toast-notice"></div>

    <!-- Scripts -->
    <script src="js/lyrics-data.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/audio-synth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
